name: Feature request
description: 提议一个具体、可验证的用户场景
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 请用“我想说一句什么，最后希望得到什么结果”描述
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可观察的结果描述完成条件
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或限制
